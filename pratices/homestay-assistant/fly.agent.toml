app = "homestay-agent-2"
primary_region = "sin"

[build]
dockerfile = "Dockerfile.agent"

[env]
NODE_ENV = "production"
PORT = "4111"
MASTRA_DATA_DIR = "/data"

[http_service]
internal_port = 4111
force_https = true
auto_start_machines = true
auto_stop_machines = "stop"
min_machines_running = 0

[[mounts]]
source = "mastra_data"
destination = "/data"
