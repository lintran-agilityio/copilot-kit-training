app = "homestay-web-2"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.web"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = false
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
   memory = "512mb"