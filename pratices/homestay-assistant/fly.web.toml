# fly.toml app configuration file generated for homestay-web on 2026-08-26T17:22:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'homestay-web'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.web'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
