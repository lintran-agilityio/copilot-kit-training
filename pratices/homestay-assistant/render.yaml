# Homestay Assistant — Render Blueprint
# Docs: docs/deploy-render.md
#
# Deploy: Dashboard → New → Blueprint → connect this repo.
# Secrets with sync: false are prompted during Blueprint setup.

databases:
  - name: homestay-db
    plan: free
    databaseName: homestay_assistant
    postgresMajorVersion: "16"

services:
  # NestJS REST API (rooms / bookings)
  - type: web
    name: homestay-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm exec turbo build --filter=api
    # Free tier does not support preDeployCommand — run migrate before start instead.
    startCommand: pnpm --filter api db:migrate && pnpm --filter api start:prod
    healthCheckPath: /
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: homestay-db
          property: connectionString

  # Next.js + CopilotKit (embeds Mastra agents via workspace package `agent`)
  - type: web
    name: homestay-web
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm exec turbo build --filter=web
    startCommand: pnpm --filter web start
    healthCheckPath: /login
    buildFilter:
      paths:
        - apps/web/**
        - apps/agent/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          name: homestay-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /login
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: /
      - key: OPENAI_API_KEY
        sync: false

  # Mastra Studio / standalone agent server (optional — chat runs in-process on web)
  - type: web
    name: homestay-agent
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm exec turbo build --filter=agent
    startCommand: pnpm --filter agent start
    buildFilter:
      paths:
        - apps/agent/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          name: homestay-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: OPENAI_API_KEY
        sync: false
      # Optional Mastra Platform observability — add in Dashboard if needed:
      # MASTRA_PLATFORM_ACCESS_TOKEN, MASTRA_PROJECT_ID
