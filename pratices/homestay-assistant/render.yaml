services:
  # ============================================================
  # EVALITE DASHBOARD
  # ============================================================
  # `evalite serve` executes the suite once at process startup and keeps its
  # interactive results UI alive. It intentionally has in-memory storage:
  # every deploy starts a fresh, fixture-backed evaluation run rather than
  # retaining agent conversations or test artifacts on Render's filesystem.
  #
  # The UI includes test prompts, outputs, and tool traces. Restrict access in
  # Render (for example, with an IP allow list) before sharing this service.
  - type: web
    name: homestay-evalite
    runtime: node
    plan: starter

    # Evalite and the Mastra CLI are package devDependencies. Keep them in this
    # service's production image because `evalite serve` runs at startup.
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile --prod=false
      pnpm turbo build --filter=agent

    # `eval:serve:render` (not `eval:serve`) preloads scripts/render-evalite-serve.mjs,
    # which forces Evalite's Fastify dashboard to bind 0.0.0.0:$PORT. Evalite
    # 0.19.0 otherwise binds 127.0.0.1 and Render's port scan times out.
    startCommand: pnpm --filter=agent eval:serve:render

    # Unlike the human-facing UI, this endpoint is a small stable health probe
    # as soon as Evalite's Fastify server starts (before a long LLM eval ends).
    healthCheckPath: /api/server-state

    buildFilter:
      paths:
        - apps/agent/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Evalite reads this through evalite.config.ts so it binds to Render's
      # public HTTP port instead of its local default (3006).
      - key: PORT
        value: "10000"

      - key: NODE_ENV
        value: production

      - key: AI_PROVIDER
        value: openai

      # Required for behavioral and conversation suites. Add this as a Render
      # secret; never commit it.
      - key: OPENAI_API_KEY
        sync: false

      # Trailing-60s token budget the eval run paces itself to, so a fresh
      # `evalite serve` never bursts past OpenAI's org-wide 200k TPM cap
      # (evals/support/model-rate-limit.setup.ts). Lower it if this key's org
      # shares the cap with the other services; set 0 to disable pacing.
      - key: EVAL_TPM_BUDGET
        value: "150000"

      # Evals replace requests to this origin with fixture responses, so the
      # dashboard never reads or mutates the deployed NestJS database.
      - key: API_URL
        value: https://evalite-fixture.invalid

      # Eval threads use ephemeral storage and must not be written into the
      # source tree or mistaken for production agent history.
      - key: MASTRA_DATA_DIR
        value: /tmp/mastra-evalite

  # ============================================================
  # NEXT.JS WEB
  # ============================================================
  - type: web
    name: homestay-web
    runtime: node
    plan: starter

    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm turbo build --filter=web

    startCommand: pnpm --filter=web start

    healthCheckPath: /

    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      # Server-side base URL for the NestJS API (utils/urls.ts reads process.env.API_URL).
      # Set to the homestay-api service URL, e.g. https://homestay-api-majb.onrender.com
      # NOTE: getApiUrl() strips trailing slashes, but keep this value slash-free
      # anyway — the web services concatenate `${API_URL}/rooms`.
      - key: API_URL
        sync: false

      # CopilotKit Intelligence (chat runtime + realtime WS proxy in server.mjs).
      - key: INTELLIGENCE_API_URL
        sync: false
      - key: INTELLIGENCE_GATEWAY_WS_URL
        sync: false
      - key: INTELLIGENCE_API_KEY
        sync: false

      # Public hostname(s) for the realtime WS URL rewrite (lib/rewrite-intelligence-ws-url.ts).
      - key: ALLOWED_PUBLIC_HOSTS
        sync: false

      # Clerk auth (also read by the in-process Mastra agent's auth middleware).
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

      # The Mastra homestay agent runs in-process in this Next app (see
      # app/api/copilotkit/[[...slug]]/route.ts). It needs the chat-model key.
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false

  # ============================================================
  # MASTRA AGENT
  # ============================================================
  - type: web
    name: homestay-agent
    runtime: node
    plan: starter

    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm turbo build --filter=agent

    startCommand: pnpm --filter=agent start

    healthCheckPath: /health

    buildFilter:
      paths:
        - apps/agent/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      - key: AI_MODEL
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: CEREBRAS_API_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: homestay-db
          property: connectionString

  # ============================================================
  # NESTJS API
  # ============================================================
  - type: web
    name: homestay-api
    runtime: node
    plan: starter

    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm turbo build --filter=api

    startCommand: pnpm --filter=api start:prod

    # Mirrors fly.api.toml's release_command: create/upgrade the schema and seed
    # the room catalog before the new version goes live. Without this the DB has
    # no tables and every request 500s.
    preDeployCommand: pnpm --filter=api db:migrate && pnpm --filter=api db:seed

    # `/` is the health route (AppController.getRoot); there is no `/health` path.
    healthCheckPath: /

    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      # Required by ClerkAuthGuard (apps/api/src/auth/clerk-auth.guard.ts) to
      # verify the web's Clerk JWT. Without it every /bookings route 401s with
      # "Authentication is not configured". Must match the web service's key.
      - key: CLERK_SECRET_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: homestay-db
          property: connectionString

databases:
  - name: homestay-db
    plan: basic-256mb
